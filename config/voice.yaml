# Voice satellite configuration.
#
# The voice process is a separate program (uv run python -m myagent.voice)
# that talks to the kernel over WebSocket only. Wake word and voice-activity
# detection ALWAYS run on-device; nothing is sent anywhere until a complete
# utterance has been detected locally.
#
# Models are downloaded once by: uv run python scripts/setup_voice.py

mode: wake            # wake | ptt | continuous
kernel_url: ws://127.0.0.1:8765/voice

# null (input)  -> AUTO: probe devices and pick the one with a live signal,
#                  re-probing whenever input goes silent (device switches,
#                  buds parked in their case, unplugged headsets...).
# null (output) -> system default, refreshed during quiet-time resyncs.
# Pin a specific device only if auto picks wrong; list names with:
#   uv run python -m myagent.voice --list-devices
input_device: null
output_device: null

# null -> %LOCALAPPDATA%/MyAgent/models
models_dir: null

wake:
  # openWakeWord built-in model names: hey_jarvis, alexa, hey_mycroft.
  # Run --mic-check and watch the score columns to pick the one your voice
  # actually triggers, then set it here.
  model: hey_jarvis
  # Slightly BELOW your typical score in --mic-check.
  threshold: 0.4
  # Seconds of attention AFTER the assistant finishes speaking. Each exchange
  # refreshes this, so a continuing conversation never needs the wake word
  # again - it only closes after this much real silence.
  followup_window: 30.0

vad:
  threshold: 0.5
  min_speech_ms: 250    # shorter bursts are ignored as noise
  silence_ms: 600       # this much silence ends the utterance (lower = snappier)
  max_utterance_s: 30   # hard cap; force-close pathological segments

stt:
  # groq:  fast cloud Whisper (~5x faster than local CPU here). Utterance
  #        audio is uploaded to Groq; falls back to local automatically if the
  #        network or API fails.
  # local: fully offline, slower. Use 'tiny.en' below to speed it up.
  engine: groq
  groq_model: whisper-large-v3-turbo
  model: base.en        # local engine: tiny.en | base.en | small.en
  compute_type: int8

tts:
  # windows: instant OS voices (default - works on any CPU, no downloads)
  # kokoro:  near-human quality; only for CPUs that synthesize faster than
  #          real time (this laptop measured 7s per 3s of audio -> windows)
  engine: windows
  windows_voice: null   # substring of a voice name, e.g. "Zira"; null = default
  voice: af_heart       # kokoro voice id (engine: kokoro)
  speed: 1.0
