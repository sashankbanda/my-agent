[project]
name = "myagent"
version = "0.1.0"
description = "MyAgent - personal AI operating layer (kernel)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.60",
    "pydantic>=2.8",
    "structlog>=24.4",
    "keyring>=25.0",
    "pyyaml>=6.0",
    "cryptography>=50.0.0",
    "zstandard>=0.25.0",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "psutil>=7.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "httpx2>=2.9.1",
    "pytest-timeout>=2.4.0",
]
# Voice satellite (CPU-only ONNX stack). Kernel-only installs: --no-group voice
voice = [
    "sounddevice>=0.5",
    "openwakeword>=0.6",
    "faster-whisper>=1.1",
    "kokoro-onnx>=0.4",
    "onnxruntime>=1.20",
    "numpy>=2.0",
    "keyboard>=0.13.5",
    "websockets>=17.0.1",
    "winrt-runtime>=3.2.1",
    "winrt-windows-media-speechsynthesis>=3.2.1",
    "winrt-windows-storage-streams>=3.2.1",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
]

[tool.uv]
default-groups = ["dev", "voice"]
# Primary target is Windows 11 (TC-02); spares resolution from linux-only pins.
environments = ["sys_platform == 'win32'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myagent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No test may hang the suite: sockets and subprocesses are involved, and a
# blocked receive used to stall CI indefinitely.
timeout = 120

[project.scripts]
myagent = "myagent.__main__:main"
myagent-start = "myagent.start:main"

